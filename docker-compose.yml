services:
  # --- Simulated microservices ---
  api-gateway:
    build: services/api-gateway
    ports:
      - "8080:8000"
    networks:
      - infrawatch

  payment-service:
    build: services/payment-service
    ports:
      - "8001:8001"
    networks:
      - infrawatch

  user-service:
    build: services/user-service
    ports:
      - "8002:8002"
    networks:
      - infrawatch

  order-service:
    build: services/order-service
    ports:
      - "8003:8003"
    networks:
      - infrawatch

  redis-cache:
    build: services/redis-cache
    ports:
      - "8004:8004"
    networks:
      - infrawatch

  # --- Infrastructure ---
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - infrawatch
    depends_on:
      - api-gateway
      - payment-service
      - user-service
      - order-service
      - redis-cache

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=infrawatch
      - GF_USERS_ALLOW_SIGN_UP=false
      # Set to your Discord channel webhook URL to receive alerts (required for alert delivery)
      - DISCORD_WEBHOOK_URL= placeholder
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - infrawatch
    depends_on:
      - prometheus

  neo4j:
    image: neo4j:5.21-community
    hostname: neo4j
    environment:
      - NEO4J_AUTH=neo4j/infrawatch
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j-data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - infrawatch

  streamlit-ui:
    build: ui
    ports:
      - "8501:8501"
    networks:
      - infrawatch
    depends_on:
      - prometheus
      - grafana
      - neo4j
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=infrawatch

  # --- API Backend & Frontend ---
  api-backend:
    build:
      context: .
      dockerfile: api_backend/Dockerfile
    ports:
      - "8090:8090"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PROMETHEUS_URL=http://prometheus:9090
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=infrawatch
      - API_GATEWAY_HOST=api-gateway
      - PAYMENT_SERVICE_HOST=payment-service
      - USER_SERVICE_HOST=user-service
      - ORDER_SERVICE_HOST=order-service
      - REDIS_CACHE_HOST=redis-cache
      - NEO4J_HOST=neo4j
      - OLLAMA_URL=http://host.docker.internal:11434
    networks:
      - infrawatch
    depends_on:
      - prometheus
      - neo4j

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - API_BACKEND_URL=http://api-backend:8090
      - PROMETHEUS_URL=http://prometheus:9090
    networks:
      - infrawatch
    depends_on:
      - api-backend

volumes:
  prometheus-data:
  grafana-data:
  neo4j-data:

networks:
  infrawatch:
    driver: bridge
