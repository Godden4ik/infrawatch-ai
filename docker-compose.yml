services:
  # --- Simulated microservices ---
  api-gateway:
    build: services/api-gateway
    ports:
      - "8080:8000"
    networks:
      - infrawatch

  payment-service:
    build: services/payment-service
    ports:
      - "8001:8001"
    networks:
      - infrawatch

  user-service:
    build: services/user-service
    ports:
      - "8002:8002"
    networks:
      - infrawatch

  order-service:
    build: services/order-service
    ports:
      - "8003:8003"
    networks:
      - infrawatch

  redis-cache:
    build: services/redis-cache
    ports:
      - "8004:8004"
    networks:
      - infrawatch

  # --- Infrastructure ---
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - infrawatch
    depends_on:
      - api-gateway
      - payment-service
      - user-service
      - order-service
      - redis-cache

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-infrawatch}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Set to your Discord channel webhook URL to receive alerts (required for alert delivery)
      - DISCORD_WEBHOOK_URL= placeholder
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - infrawatch
    depends_on:
      - prometheus

  neo4j:
    image: neo4j:5.21-community
    hostname: neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-infrawatch}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j-data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - infrawatch

  # --- API Backend & Frontend ---
  api-backend:
    build:
      context: .
      dockerfile: api_backend/Dockerfile
    ports:
      - "8090:8090"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PROMETHEUS_URL=http://prometheus:9090
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-infrawatch}
      - API_GATEWAY_HOST=api-gateway
      - PAYMENT_SERVICE_HOST=payment-service
      - USER_SERVICE_HOST=user-service
      - ORDER_SERVICE_HOST=order-service
      - REDIS_CACHE_HOST=redis-cache
      - NEO4J_HOST=neo4j
      - OLLAMA_URL=http://host.docker.internal:11434
      # Benchmark service URLs (internal Docker network)
      - API_GATEWAY_URL=http://api-gateway:8000
      - PAYMENT_SERVICE_URL=http://payment-service:8001
      - USER_SERVICE_URL=http://user-service:8002
      - ORDER_SERVICE_URL=http://order-service:8003
      - REDIS_CACHE_URL=http://redis-cache:8004
      - GOLD_DATASET_PATH=scenarios/gold_truth.json
      - BENCHMARK_RESULTS_PATH=scenarios/benchmark_results.json
    networks:
      - infrawatch
    depends_on:
      - prometheus
      - neo4j
    volumes:
      - ./scenarios:/project/scenarios

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - API_BACKEND_URL=http://api-backend:8090
      - PROMETHEUS_URL=http://prometheus:9090
      # Shared-password gate for hosted demos. Set both in .env to enable.
      - DEMO_PASSWORD=${DEMO_PASSWORD:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Public URLs surfaced by the header launcher strip when the demo
      # is hosted. Defaults are localhost (no override → strip falls back
      # via env.ts defaults).
      - NEXT_PUBLIC_GRAFANA_URL=${PUBLIC_GRAFANA_URL:-http://localhost:3000}
      - NEXT_PUBLIC_PROMETHEUS_URL=${PUBLIC_PROMETHEUS_URL:-http://localhost:9090}
      - NEXT_PUBLIC_NEO4J_URL=${PUBLIC_NEO4J_URL:-http://localhost:7474}
    networks:
      - infrawatch
    depends_on:
      - api-backend
    profiles:
      - demo

  # ─── Caddy reverse proxy ────────────────────────────────────────────────
  # Cloudflare Tunnel routes the InfraWatch hostnames here; Caddy dispatches
  # by Host header and gates the infrastructure-tool subdomains with
  # forward_auth against /api/auth-check on the frontend. Only enabled with
  # the `tunnel` profile.
  caddy:
    image: caddy:2-alpine
    container_name: infrawatch-caddy
    restart: unless-stopped
    ports:
      # Cloudflare Tunnel on the host points at localhost:8888 → Caddy → upstreams.
      # Port 8080 is taken by api-gateway, 8090 by api-backend.
      - "8888:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      - INFRAWATCH_HOST=${INFRAWATCH_HOST:-infrawatch.exdbots.com}
      - GRAFANA_HOST=${GRAFANA_HOST:-grafana-infrawatch.exdbots.com}
      - PROMETHEUS_HOST=${PROMETHEUS_HOST:-prom-infrawatch.exdbots.com}
      - NEO4J_HOST=${NEO4J_HOST:-neo4j-infrawatch.exdbots.com}
    networks:
      - infrawatch
    depends_on:
      - frontend
      - grafana
      - prometheus
      - neo4j
    profiles:
      - tunnel

volumes:
  prometheus-data:
  grafana-data:
  neo4j-data:

networks:
  infrawatch:
    driver: bridge
