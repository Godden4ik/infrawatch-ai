[project]
name = "teg"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]",
    "anthropic",
    "fastapi",
    "httpx>=0.27",
    "neo4j>=5.0",
    "prometheus-client",
    "uvicorn",
    "langgraph>=1.0",
    "langchain-anthropic>=0.3",
    "langchain-mcp-adapters>=0.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
