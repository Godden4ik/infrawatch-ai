[project]
name = "teg"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]",
    "anthropic",
    "fastapi",
    "httpx>=0.27",
    "neo4j>=5.0",
    "prometheus-client",
    "uvicorn",
    "langgraph>=1.0",
    "langchain-anthropic>=0.3",
    "langchain-mcp-adapters>=0.2",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "pyyaml>=6.0",
    "langchain-ollama>=0.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.12",
    "pyright>=1.1",
]

[tool.setuptools.packages.find]
include = ["agents*", "graph*", "scripts*"]

[tool.setuptools.package-dir]
prometheus_mcp = "mcp-servers/prometheus_mcp"
grafana_mcp = "mcp-servers/grafana_mcp"
neo4j_mcp = "mcp-servers/neo4j_mcp"
api_backend = "api_backend"
"api_backend.routes" = "api_backend/routes"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
